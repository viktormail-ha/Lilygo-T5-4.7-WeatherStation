; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32          ; Use esp32 for old board (with 5 buttons) or esp32s3 for new board (with 3 buttons)

[common]
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    Wire
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git
    bblanchon/ArduinoJson@6.21.5
    knolleary/PubSubClient@2.8
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

; ============================================================
; Старая версия LilyGO T5 4.7 (обычный ESP32)
; ============================================================
[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = ${common.framework}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DLILYGO_T5_EPD47
board_build.f_cpu = 240000000L
board_build.partitions = default.csv

; ============================================================
; Новая версия LilyGO T5 4.7 (ESP32-S3)
; ============================================================
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLILYGO_T5_EPD47_S3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
